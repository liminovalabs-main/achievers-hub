services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: achievers_hub
      POSTGRES_USER: achievers
      POSTGRES_PASSWORD: achievers
    ports:
      - "5432:5432"
    volumes:
      - achievers_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achievers -d achievers_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  achievers_postgres:
